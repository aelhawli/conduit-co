<script>
    const fileInput = document.getElementById('pdf-input');
    const fileLabel = document.getElementById('file-label');
    let cachedAuditData = null;

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        fileLabel.innerText = "Selected: " + e.target.files[0].name;
      }
    });

    function getBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => {
          let encoded = reader.result.toString().replace(/^data:(.*,)?/, '');
          if ((encoded.length % 4) !== 0) {
            encoded += '='.repeat((4 - encoded.length % 4) % 4);
          }
          resolve(encoded);
        };
        reader.onerror = error => reject(error);
      });
    }

    async function runAudit() {
      const file = fileInput.files[0];
      if (!file) return alert('Please select a PDF drawing set first.');

      const btn = document.getElementById('scan-btn');
      const resultsDiv = document.getElementById('results');
      const summaryP = document.getElementById('audit-summary');

      btn.innerText = 'Converting & Analyzing Drawing Set...';
      btn.disabled = true;

      try {
        const base64String = await getBase64(file);

        const response = await fetch('https://withered-salad-c16e.letstalk.workers.dev', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pdfBase64: base64String })
        });

        const data = await response.json();

        if (data.success) {
          cachedAuditData = data.audit;
          summaryP.innerText = data.audit.summary;
          resultsDiv.classList.remove('hidden');
        } else {
          alert('Error: ' + (data.error || 'Could not parse PDF'));
        }
      } catch (err) {
        alert('Failed to connect to AI audit engine: ' + err.message);
      } finally {
        btn.innerText = 'Run Free Tender Audit →';
        btn.disabled = false;
      }
    }

    function unlockAudit(e) {
      e.preventDefault();

      document.getElementById('lead-gate').classList.add('hidden');
      const riskListDiv = document.getElementById('risk-list');
      riskListDiv.innerHTML = '<h4 class="text-xs font-bold text-brand-amber uppercase tracking-wider mb-2">Identified Tender Risks & Traps:</h4>';

      if (cachedAuditData && cachedAuditData.topRisks) {
        cachedAuditData.topRisks.forEach(risk => {
          const card = document.createElement('div');
          card.className = 'text-xs bg-brand-card p-3.5 rounded-lg border-l-4 border-brand-amber text-slate-200';
          card.innerHTML = `<strong class="text-brand-amber block mb-1 text-xs uppercase tracking-wide">${risk.title}</strong>${risk.description}`;
          riskListDiv.appendChild(card);
        });
      }

      riskListDiv.classList.remove('hidden');
    }
  </script>
